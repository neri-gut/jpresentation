[[permission]]
identifier = "operator-commands"
description = "Operator console IPC. Must not be granted to audience or speaker."
commands.allow = [
  "profile_list",
  "profile_create",
  "profile_select",
  "profile_update",
  "profile_duplicate",
  "profile_delete",
  "content_languages_list",
  "settings_get",
  "settings_set",
  "monitors_list",
  "monitors_identify",
  "output_get",
  "clock_arm",
  "clock_start",
  "clock_pause",
  "clock_finish"
]

[[permission]]
identifier = "output-read"
description = "Read-only stage/clock snapshot so a surface can resync without mutating output."
commands.allow = ["output_get"]
